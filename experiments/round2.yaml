  description: 'Rodada 2C, ablação do pré-treino (20 mil passos, comparada pelo probe e pela val/loss): Referência: config padrão nas três bases.'
  set:
  - optim.steps=20000
  - probe.every=10000
- name: abl_only_home_credit
