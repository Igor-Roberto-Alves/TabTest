# Rodada 2 (ver experiments/README.md, "Próximos passos" da rodada 1).
# python -m src.pragma.queue experiments/round2.yaml
# A: fine-tuning de 20 mil passos com 3 sementes  B: curva de rótulos (1% e 10%)
# C: ablações do pré-treino (fase 4)              D: busca de hiperparâmetros (configs/pragma/sweep_pretrain.yaml)
name: round2
items:
- name: ft_home_credit_full_20k_s0
  script: finetune
  description: 'Rodada 2A: Home Credit (default, AUC). Fine-tuning completo do base_v1 com 20 mil passos (rodada 1: 6 mil), semente 0 de 3.'
  set:
  - init=runs/pragma/base_v1/ckpt_best.pt
  - data.dataset=home_credit
  - mode=full
  - optim.steps=20000
  - log.eval_every=2000
  - seed=0
- name: ft_home_credit_full_20k_s1
