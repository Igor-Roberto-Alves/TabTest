name: round3_direita
items:
- name: ft_home_credit_full_frac01b
  script: finetune
  description: 'Rodada 3, protocolo B'': Home Credit (default, AUC). fine-tuning completo do base_v1 com 1% das linhas de treino, 1500 passos, lr do backbone 3.0e-5, avaliação a cada 50 passos.'
  set:
  - init=runs/pragma/base_v1/ckpt_best.pt
  - data.dataset=home_credit
  - mode=full
  - data.label_frac=0.01
  - optim.steps=1500
  - optim.lr=3.0e-5
  - log.eval_every=50
