# Baselines XGBoost (src/baselines/xgb.py). Só CPU: a GPU fica com o modelo fundacional.
# Cada base tem uma grade pequena; a combinação vencedora é escolhida só na validação
# (por rótulo, no MBD) e só ela é avaliada no teste.
max_rounds: 3000
early_stopping: 100
log_every: 25
seed: 0

params:
  objective: binary:logistic
  eval_metric: [logloss, auc]   # a última métrica do conjunto "val" comanda o early stopping
  tree_method: hist
  device: cpu
  nthread: 16
  max_bin: 256
  learning_rate: 0.03
  max_depth: 6
  min_child_weight: 10
  subsample: 0.8
  colsample_bytree: 0.8
  reg_lambda: 1.0

grid:
  home_credit:
    - {max_depth: 6, min_child_weight: 10, colsample_bytree: 0.5}
    - {max_depth: 7, min_child_weight: 30, colsample_bytree: 0.3}
    - {max_depth: 8, min_child_weight: 50, colsample_bytree: 0.3, learning_rate: 0.04}
  amex:
    - {max_depth: 6, min_child_weight: 10, colsample_bytree: 0.5, learning_rate: 0.05}
    - {max_depth: 7, min_child_weight: 30, colsample_bytree: 0.3, learning_rate: 0.05}
  mbd_mini:   # positivos raros (0,05% a 0,45%): árvores rasas e min_child_weight baixo
    - {max_depth: 5, min_child_weight: 1, colsample_bytree: 0.8, learning_rate: 0.03}
    - {max_depth: 7, min_child_weight: 5, colsample_bytree: 0.5, learning_rate: 0.03}
